<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多段击飞训练场 · Meme 乱斗</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #fff8e8; background: #131216; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1200px; margin: auto; padding: 24px clamp(14px, 3vw, 36px) 30px; }
    header { border-left: 6px solid #f73c48; padding-left: 16px; margin-bottom: 22px; }
    h1 { margin: 0 0 5px; font-size: clamp(24px, 4vw, 39px); line-height: 1.15; font-weight: 900; }
    p { margin: 0; }
    header p, .hint { color: #d3c9cf; line-height: 1.5; font-size: .9rem; }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 296px; align-items: start; gap: 18px; }
    .arena { min-width: 0; }
    canvas { display: block; width: 100%; height: auto; background: #241a35; border: 2px solid #efe2c9; }
    .transport, .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .transport { margin-top: 10px; align-items: center; }
    .transport label { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
    button, input, select { font: inherit; }
    button, input[type="number"], select { min-height: 44px; border: 1px solid #a199a8; }
    button, select { padding: 6px 12px; color: #fff8e8; background: #29252f; }
    button { font-weight: 750; cursor: pointer; }
    button:disabled { color: #a59ba8; border-color: #625a67; cursor: default; }
    :focus-visible { outline: 3px solid #fbdb66; outline-offset: 2px; }
    .panel { background: #211e27; border: 1px solid #514a59; padding: 14px; }
    h2 { font-size: 1.05rem; margin: 0 0 4px; }
    .stages { margin: 12px 0; display: grid; gap: 8px; }
    .stage-row { display: grid; grid-template-columns: 1fr 83px; align-items: center; gap: 3px 8px;
      background: #17141c; border-left: 3px solid #82748b; padding: 8px 9px; }
    .stage-row label { font-weight: 750; }
    .stage-row input { width: 100%; min-width: 0; padding: 5px 7px; background: #312a3a; color: #fff8e8; }
    .stage-row output { grid-column: 1 / -1; font-size: .85rem; color: #d3c9cf; }
    .stage-row[data-hit="yes"] { border-color: #fbdb66; }
    .stage-row[data-hit="yes"] output { color: #fbdb66; }
    .run { flex: 1; color: #17131a; background: #fbdb66; border-color: #fbdb66; }
    .stats { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px 14px; font-variant-numeric: tabular-nums; }
    #trial-status { min-height: 1.55em; margin-top: 6px; color: #d3c9cf; line-height: 1.5; }
    #parameter-status { min-height: 1.5em; margin-top: 8px; }
    kbd, code { font-family: ui-monospace, monospace; }
    @media (max-width: 740px) {
      .lab { grid-template-columns: minmax(0, 1fr); }
      .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .stage-row { grid-template-columns: minmax(0, 1fr); align-content: start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>多段击飞训练场</h1>
      <p>调整每段的 <code>lift</code>，点「试招」或按 <kbd>U</kbd>。每次都从同一站位出招。</p>
    </header>
    <div class="lab">
      <section class="arena" aria-label="实时试招">
        <canvas id="launch-arena" width="1280" height="720" aria-label="击飞训练画面"></canvas>
        <div class="transport">
          <button id="pause-trial" type="button" disabled>暂停</button>
          <button id="step-trial" type="button" disabled>前进一帧</button>
          <label>速度<select id="trial-speed"><option value="1">1×</option><option value="0.5" selected>0.5×</option><option value="0.25">0.25×</option></select></label>
          <label><input id="show-boxes" type="checkbox">显示判定框</label>
        </div>
        <div class="stats">
          <span>命中 <strong id="try-hits">0 / 3</strong></span>
          <span>当前离地 <strong id="current-height">0</strong></span>
          <span>本次最高 <strong id="peak-height">0</strong></span>
        </div>
        <p id="trial-status" role="status">等待试招</p>
      </section>
      <form class="panel" id="launch-tuning">
        <h2>逐段调整击飞</h2>
        <p class="hint">0 表示不追加向上速度。数值以世界单位／逻辑帧计。</p>
        <div class="stages">
          <div class="stage-row"><label for="lift-1">第 1 段</label><input id="lift-1" type="number" min="0" max="32" step="any" value="8" required><output id="hit-1">等待试招</output></div>
          <div class="stage-row"><label for="lift-2">第 2 段</label><input id="lift-2" type="number" min="0" max="32" step="any" value="12" required><output id="hit-2">等待试招</output></div>
          <div class="stage-row"><label for="lift-3">第 3 段</label><input id="lift-3" type="number" min="0" max="32" step="any" value="16" required><output id="hit-3">等待试招</output></div>
        </div>
        <div class="actions">
          <button type="submit" class="run">试招</button>
          <button type="reset">恢复默认</button>
        </div>
        <p id="parameter-status" class="hint" role="status">训练场可输入 0–32，支持小数。</p>
      </form>
    </div>
  </main>
  <script src="./dist/launch-demo.bundle.js"></script>
</body>
</html>
