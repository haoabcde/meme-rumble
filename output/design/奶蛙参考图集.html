<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奶蛙 · 造型与动作参考</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#211e1b;background:#f7f3e8}
*{box-sizing:border-box}body{margin:0}main{width:min(1120px,calc(100% - 36px));margin:42px auto 64px}
header{max-width:760px;border-bottom:1px solid #cfc4a8;padding-bottom:20px}
h1{font-size:clamp(29px,5.5vw,48px);letter-spacing:-.04em;margin:0 0 8px}h2{margin:26px 0 12px;font-size:23px}
p{margin:5px 0}a{color:#564324;text-underline-offset:.18em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
figure{margin:0;background:#fff;border:1px solid #ded5c4;border-radius:9px;overflow:hidden}
.picture{display:block;background:#f6f4ee}.picture img{display:block;width:100%;height:215px;object-fit:contain;padding:9px}
figcaption{padding:10px 13px 13px}figcaption h3{margin:0;font-size:16px}figcaption p,figcaption>a{font-size:13px}
footer{margin-top:22px;padding-top:12px;border-top:1px solid #cfc4a8;font-size:14px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.picture img{height:158px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><h1>奶蛙 · 造型与动作参考</h1>
<p>12 张参考图。点图片看原图，点出处看原始页面。</p>
<p>主造型看「惊鸿一瞥」的梨形全身，再用侧脸核对眼睛和嘴。动作看仰头捧腹大笑。新版游戏立绘把手绘线条与少量像素阶梯结合起来。</p></header>
<section><h2>轮廓与五官</h2><div class="grid"><figure><a class="picture" href="https://static.milkyfrog.com/assets/design/frog-cf4eeb8c.webp"><img src="https://static.milkyfrog.com/assets/design/frog-cf4eeb8c.webp" alt="惊鸿一瞥" loading="lazy"></a><figcaption><h3>惊鸿一瞥</h3><p>三分之四视角，全身比例和小嘴的位置。</p><a href="https://milkyfrog.com/design">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s068.jpg"><img src="https://cdn.naiwa.meme/stickers/s068.jpg" alt="近距离侧脸" loading="lazy"></a><figcaption><h3>近距离侧脸</h3><p>高处的绿圈黑瞳，一条细平嘴。</p><a href="https://naiwa.meme/sticker/s068/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://static.milkyfrog.com/assets/surprise-bb084b35.webp"><img src="https://static.milkyfrog.com/assets/surprise-bb084b35.webp" alt="建模侧视" loading="lazy"></a><figcaption><h3>建模侧视</h3><p>从头部往肩背与肚子连续外扩。</p><a href="https://milkyfrog.com/design">出处</a></figcaption></figure>
<figure><a class="picture" href="https://static.milkyfrog.com/assets/design/hand-741483ab.webp"><img src="https://static.milkyfrog.com/assets/design/hand-741483ab.webp" alt="手部特写" loading="lazy"></a><figcaption><h3>手部特写</h3><p>橄榄色从指尖向手腕过渡。</p><a href="https://milkyfrog.com/design">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s063.jpg"><img src="https://cdn.naiwa.meme/stickers/s063.jpg" alt="立正" loading="lazy"></a><figcaption><h3>立正</h3><p>正面站姿，眼距和小嘴适合做头像参考。</p><a href="https://naiwa.meme/sticker/s063/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s058.png"><img src="https://cdn.naiwa.meme/stickers/s058.png" alt="站立简化版" loading="lazy"></a><figcaption><h3>站立简化版</h3><p>简化四肢后的正面剪影，适合看 Q 版比例。</p><a href="https://naiwa.meme/sticker/s058/">出处</a></figcaption></figure></div></section>
<section><h2>待机和大笑动作</h2><div class="grid"><figure><a class="picture" href="https://static.milkyfrog.com/assets/mf-poster-a73129b5.jpg"><img src="https://static.milkyfrog.com/assets/mf-poster-a73129b5.jpg" alt="封面站姿" loading="lazy"></a><figcaption><h3>封面站姿</h3><p>两手贴腹，细腿支撑圆肚。</p><a href="https://milkyfrog.com/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s064.gif"><img src="https://cdn.naiwa.meme/stickers/s064.gif" alt="待机动图" loading="lazy"></a><figcaption><h3>待机动图</h3><p>看身体重心、正侧转向和两手位置。</p><a href="https://naiwa.meme/sticker/s064/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s044.png"><img src="https://cdn.naiwa.meme/stickers/s044.png" alt="抱臂立绘" loading="lazy"></a><figcaption><h3>抱臂立绘</h3><p>看手放到身体前方时的剪影。</p><a href="https://naiwa.meme/sticker/s044/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s031.jpg"><img src="https://cdn.naiwa.meme/stickers/s031.jpg" alt="仰头捧腹大笑" loading="lazy"></a><figcaption><h3>仰头捧腹大笑</h3><p>头仰、眼闭、嘴张开，双手回到肚子上。</p><a href="https://naiwa.meme/sticker/s031/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s032.gif"><img src="https://cdn.naiwa.meme/stickers/s032.gif" alt="捧腹大笑动图" loading="lazy"></a><figcaption><h3>捧腹大笑动图</h3><p>看抬手、弯腰和笑起来的节奏。</p><a href="https://naiwa.meme/sticker/s032/">出处</a></figcaption></figure>
<figure><a class="picture" href="https://cdn.naiwa.meme/stickers/s070.gif"><img src="https://cdn.naiwa.meme/stickers/s070.gif" alt="出拳动图" loading="lazy"></a><figcaption><h3>出拳动图</h3><p>社区二创，适合参考出拳的重心转移。</p><a href="https://naiwa.meme/sticker/s070/">出处</a></figcaption></figure></div></section><footer>图片从来源站点加载。<a href="https://milkyfrog.com/design">奶蛙设计说明</a> · <a href="https://naiwa.meme/stickers/">社区完整图集</a></footer>
</main></body></html>
